services:
  bigquery:
    image: ghcr.io/novucs/local-bigquery:latest
    ports:
      - "9050:9050"  # REST API
      - "9060:9060"  # Storage Read/Write APIs
    environment:
      DEFAULT_PROJECT_ID: local
      DEFAULT_DATASET_ID: local
      # Principal for unsigned requests, and group membership for row access policies.
      # CALLER: user:local-bigquery@localhost
      # GROUPS: '{"user:alice@example.com": ["group:team@example.com"]}'
      # Directory backing gs:// URIs, or a GCS emulator instead.
      # GCS_LOCAL_ROOT: /data/gcs
      # STORAGE_EMULATOR_HOST: http://gcs:4443
      # Postgres for EXTERNAL_QUERY('us.default', 'SELECT 1').
      POSTGRES_URI: postgresql://postgres:example@postgres:5432/postgres
    volumes:
      - bigquery_data:/data
    depends_on:
      - postgres
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: example
volumes:
  bigquery_data: {}
