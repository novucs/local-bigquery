[project]
name = "local-bigquery"
version = "0.3.2"
description = "A BigQuery emulator for local development and tests"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.16"
dependencies = [
    "duckdb>=2.0.0",
    "fastapi>=0.139",
    "fastavro>=1.13.1",
    "google-cloud-bigquery-storage>=2.41.0",
    "grpcio>=1.84.1",
    "mini-racer>=0.12.4",
    "numpy>=2.5.4",
    "prompt-toolkit>=3.0.50",
    "pyarrow>=26.0.0",
    "pydantic-settings>=2.8.1",
    "pygments>=2.19.1",
    "sqlglot>=30.24",
    "uvicorn>=0.35",
]

[project.urls]
Repository = "https://github.com/novucs/local-bigquery"
Issues = "https://github.com/novucs/local-bigquery/issues"

[project.scripts]
local-bigquery = "local_bigquery.cli:main"

[project.entry-points.pytest11]
local_bigquery = "local_bigquery.pytest_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src"]

[dependency-groups]
dev = [
    "cryptography>=49.0.0",
    "datamodel-code-generator>=0.82.0",
    "db-dtypes>=1.7.1",
    "google-cloud-bigquery>=3.31.0",
    "hypothesis>=6.168.1",
    "pandas>=3.0.6",
    "psycopg2-binary>=2.9.13",
    "pytest>=8.3.5",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "sqlalchemy-bigquery>=1.13.0",
    "testcontainers>=4.15.0",
]

[tool.pytest.ini_options]
xfail_strict = true
addopts = "-n auto --dist loadgroup"
filterwarnings = [
    "error",
    "ignore:Retrieving Arrow record batches directly:PendingDeprecationWarning",
    "ignore:Loading pandas DataFrame into BigQuery will require pandas-gbq:FutureWarning",
    "ignore:Retrieving DataFrames via google-cloud-bigquery:PendingDeprecationWarning",
    "ignore:Loading DataFrames via google-cloud-bigquery:PendingDeprecationWarning",
]
timeout = 30
