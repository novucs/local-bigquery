[project]
name = "local_bigquery"
version = "0.3.0"
description = "Run BigQuery locally"
requires-python = ">=3.13,<3.14"
dependencies = [
    "duckdb>=1.5.5",
    "fastapi>=0.139",
    "fastavro>=1.12.2",
    "google-cloud-bigquery-storage>=2.41.0",
    "grpcio>=1.83.0",
    "mini-racer>=0.12.4",
    "prompt-toolkit>=3.0.50",
    "pyarrow>=25.0.1",
    "pydantic-settings>=2.8.1",
    "pygments>=2.19.1",
    "sqlglot>=30.19",
    "uvicorn>=0.35",
]

[project.scripts]
local-bigquery = "local_bigquery.cli:main"

[project.entry-points.pytest11]
local_bigquery = "local_bigquery.pytest_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "cryptography>=49.0.0",
    "datamodel-code-generator>=0.82.0",
    "db-dtypes>=1.7.1",
    "google-cloud-bigquery>=3.31.0",
    "hypothesis>=6.168.1",
    "pandas>=3.0.6",
    "psycopg2-binary>=2.9.13",
    "pytest>=8.3.5",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "sqlalchemy-bigquery>=1.13.0",
    "testcontainers>=4.10.0",
]

[tool.pytest.ini_options]
xfail_strict = true
addopts = "-p no:warnings -n auto --dist loadgroup"
timeout = 30
